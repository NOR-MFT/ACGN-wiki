<style type="text/css">

  /* 新增：游戏档案主标题样式 */
  .game-archive-main-title {
    text-align: center;
    color: #1a5f85; /* 匹配档案深蓝系文字色 */
    font-size: 36px;
    font-weight: 700;
    margin: 20px 0 40px 0;
    padding-bottom: 16px;
    border-bottom: 3px double #2c7fb8; /* 双线条边框模拟档案标题栏 */
    position: relative;
    letter-spacing: 2px; /* 字间距增强档案标题质感 */
  }

  /* 标题装饰伪元素（呼应书本翻角/蓝色系） */
  .game-archive-main-title::before,
  .game-archive-main-title::after {
    content: "";
    position: absolute;
    bottom: -3px;
    width: 40px;
    height: 12px;
    background: #a8d8ea; /* 匹配卡片翻角色 */
    border-radius: 4px;
  }

  .game-archive-main-title::before {
    left: 50%;
    transform: translateX(-120px);
  }

  .game-archive-main-title::after {
    right: 50%;
    transform: translateX(120px);
  }

  /* 档案馆容器样式 - 整体布局 */
  .game-archive-container {
    display: flex;
    flex-wrap: wrap;
    gap: 32px;
    margin: 32px 0;
    justify-content: flex-start;
  }

  /* 档案卡片（书本风格）核心样式 */
  .game-archive-card {
    width: 300px;
    padding: 0;
    border-radius: 12px 4px 12px 12px; /* 模拟书本翻角效果 */
    background: linear-gradient(135deg, #e8f4f8 0%, #f0f8fb 100%); /* 浅蓝渐变纸张质感 */
    border: 2px solid #2c7fb8; /* 深蓝边框模拟档案夹 */
    box-shadow: 
      0 8px 16px rgba(44, 127, 184, 0.15), /* 立体阴影 */
      inset 0 1px 0 #ffffff, /* 内高光模拟纸张 */
      3px 3px 0 #a8d8ea; /* 侧边投影强化书本感 */
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
  }

  /* 卡片悬停效果 - 模拟书本拿起的动效 */
  .game-archive-card:hover {
    transform: translateY(-6px) rotate(1deg);
    box-shadow: 
      0 12px 24px rgba(44, 127, 184, 0.25),
      inset 0 1px 0 #ffffff,
      5px 5px 0 #8fc5e9;
  }

  /* 档案标签（书本标题栏） */
  .game-archive-card .archive-title {
    background: linear-gradient(90deg, #2c7fb8 0%, #3f94c5 100%); /* 深蓝渐变标签 */
    color: #ffffff;
    padding: 12px 16px;
    margin: 0;
    font-size: 18px;
    font-weight: 600;
    border-bottom: 1px solid #1a5f85; /* 标签下边框强化层次 */
  }

  /* 档案封面图容器 */
  .game-archive-card .archive-cover {
    padding: 16px;
  }

  .game-archive-card .archive-cover img {
    width: 100%;
    height: auto;
    border-radius: 8px;
    border: 1px solid #b8d8e8; /* 图片边框呼应蓝色系 */
    box-shadow: 0 2px 4px rgba(44, 127, 184, 0.1);
  }

  /* 档案内容区 */
  .game-archive-card .archive-content {
    padding: 0 16px 16px;
  }

  .game-archive-card .archive-content-title {
    margin: 0 0 8px 0;
    font-size: 14px;
    color: #1a5f85; /* 深蓝文字 */
    font-weight: 500;
  }

  /* 档案链接样式 */
  .game-archive-card .archive-link-list {
    margin: 0;
    padding-left: 20px;
    color: #666;
    font-size: 14px;
    line-height: 1.8;
  }

  .game-archive-card .archive-link-list a {
    color: #2c7fb8;
    text-decoration: none;
    border-bottom: 1px dashed transparent;
    transition: all 0.2s ease;
  }

  .game-archive-card .archive-link-list a:hover {
    color: #1a5f85;
    border-bottom: 1px dashed #1a5f85;
  }

  /* 模拟书本翻角装饰 */
  .game-archive-card::after {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    width: 20px;
    height: 20px;
    background: linear-gradient(135deg, transparent 0%, transparent 50%, #a8d8ea 50%, #c4e3f0 100%);
    border-radius: 0 0 0 8px;
    box-shadow: -1px 1px 2px rgba(44, 127, 184, 0.1);
  }
</style>
