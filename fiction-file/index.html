<style type="text/css">
  /* ========== 小说档案馆主标题样式 ========== */
  .fiction-archive-main-title {
    text-align: center;
    color: #1a5f85;
    font-size: 36px;
    font-weight: 700;
    margin: 20px 0 40px 0;
    padding-bottom: 16px;
    border-bottom: 3px double #2c7fb8;
    position: relative;
    letter-spacing: 2px;
  }

  .fiction-archive-main-title::before,
  .fiction-archive-main-title::after {
    content: "";
    position: absolute;
    bottom: -3px;
    width: 40px;
    height: 12px;
    background: #a8d8ea;
    border-radius: 4px;
  }

  .fiction-archive-main-title::before {
    left: 50%;
    transform: translateX(-120px);
  }

  .fiction-archive-main-title::after {
    right: 50%;
    transform: translateX(120px);
  }

  /* ========== 档案馆容器：三列网格 ========== */
  .fiction-archive-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 50px;                         /* 增大间距，为书签留出充分空间 */
    margin: 32px 0;
  }

  /* ========== 小说卡片：仿真实书本样式 ========== */
  .fiction-archive-card {
    width: 100%;
    position: relative;
    border-radius: 4px 8px 8px 4px;
    background: #d0e4f2;
    border-left: 10px solid #1a5f85;
    box-shadow:
      4px 4px 10px rgba(0,0,0,0.2),
      inset -2px 0 0 rgba(255,255,255,0.3),
      inset 0 -2px 0 rgba(0,0,0,0.1);
    transition: all 0.3s ease;
    overflow: visible;                 /* 允许书签伸出 */
    display: flex;
    flex-direction: column;
  }

  .fiction-archive-card:hover {
    transform: translateY(-6px);
    box-shadow:
      8px 8px 20px rgba(0,0,0,0.25),
      inset -2px 0 0 rgba(255,255,255,0.4),
      inset 0 -2px 0 rgba(0,0,0,0.15);
  }

  /* 书脊装饰线 */
  .fiction-archive-card::before {
    content: "";
    position: absolute;
    left: -8px;
    top: 10px;
    bottom: 10px;
    width: 4px;
    background: linear-gradient(180deg, 
      rgba(255,255,255,0.4) 0%, 
      rgba(255,255,255,0) 50%, 
      rgba(255,255,255,0.4) 100%);
    border-radius: 2px;
    z-index: 1;
  }

  /* ========== 书本封面 ========== */
  .fiction-archive-card .archive-cover {
    padding: 0;
    flex: 1;
    position: relative;
    border-radius: 0 8px 0 0;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }

  .fiction-archive-card .archive-cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border: none;
    box-shadow: none;
  }

  /* ========== 书名（浮于封面底部） ========== */
  .fiction-archive-card .archive-title {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 12px 16px;
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    font-family: 'Georgia', 'Noto Serif SC', serif;
    color: #fff;
    background: linear-gradient(transparent, rgba(26, 95, 133, 0.85) 30%);
    text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
    letter-spacing: 1px;
    z-index: 2;
    border-bottom: none;
  }

  /* ========== 书签列表（紧贴卡片右侧，不遮挡封面） ========== */
  .archive-link-list {
    list-style: none;
    margin: 0;
    padding: 0;
    position: absolute;
    left: 100%;                        /* 左侧边缘紧贴卡片右边界，整体向右伸出 */
    top: 12px;
    z-index: 5;
    pointer-events: none;              /* 容器不阻挡封面点击 */
  }

  .archive-link-list li {
    margin-bottom: 14px;
    pointer-events: auto;
    position: relative;
  }

  /* 书签条本体 */
  .archive-link-list li a {
    display: block;
    font-size: 14px;
    font-weight: 600;
    padding: 8px 20px 8px 14px;
    color: #fff !important;
    text-decoration: none !important;
    border-radius: 0 6px 6px 0;
    box-shadow: 3px 3px 6px rgba(0,0,0,0.2);
    transition: all 0.2s;
    position: relative;
    white-space: nowrap;
    border: none;
    background: linear-gradient(135deg, #4a8bc2, #3c7abf); /* 默认蓝 */
  }

  /* 书签左侧小三角（指向封面） */
  .archive-link-list li a::before {
    content: "";
    position: absolute;
    left: -8px;
    top: 50%;
    transform: translateY(-50%);
    width: 0;
    height: 0;
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
    border-right: 8px solid #4a8bc2;   /* 颜色继承 */
  }

  /* 书签绳孔（逼真细节） */
  .archive-link-list li a::after {
    content: "";
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    width: 7px;
    height: 7px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.7);
    background: transparent;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);
  }

  /* 不同颜色的书签（保持页面蓝色系） */
  .archive-link-list li:nth-child(1) a { background: linear-gradient(135deg, #4a8bc2, #3c7abf); }
  .archive-link-list li:nth-child(1) a::before { border-right-color: #4a8bc2; }
  .archive-link-list li:nth-child(2) a { background: linear-gradient(135deg, #3c7abf, #2c6a9e); }
  .archive-link-list li:nth-child(2) a::before { border-right-color: #3c7abf; }
  .archive-link-list li:nth-child(3) a { background: linear-gradient(135deg, #2c6a9e, #1e4f7a); }
  .archive-link-list li:nth-child(3) a::before { border-right-color: #2c6a9e; }
  .archive-link-list li:nth-child(4) a { background: linear-gradient(135deg, #5b9bd5, #4a8bc2); }
  .archive-link-list li:nth-child(4) a::before { border-right-color: #5b9bd5; }

  .archive-link-list li a:hover {
    transform: translateX(-4px);
    box-shadow: 5px 5px 12px rgba(0,0,0,0.3);
  }

  /* 仅隐藏旧的“内容一览”标题，保留内容区以显示书签 */
  .fiction-archive-card .archive-content-title {
    display: none;
  }

  /* ========== 移动端适配 ========== */
  @media (max-width: 900px) {
    .fiction-archive-container {
      grid-template-columns: repeat(2, 1fr);
      gap: 40px;
    }
    .fiction-archive-main-title {
      font-size: 28px;
    }
    .archive-link-list li a {
      font-size: 13px;
      padding: 6px 16px 6px 10px;
    }
  }

  @media (max-width: 600px) {
    .fiction-archive-container {
      grid-template-columns: 1fr;
      gap: 40px;
    }
    .fiction-archive-main-title {
      font-size: 24px;
    }
    .archive-link-list {
      left: 100%;                       /* 确保手机端依然紧贴 */
    }
  }
</style>
